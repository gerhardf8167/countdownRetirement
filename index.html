<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f36">
  <meta name="description" content="Dein Countdown bis zum 31. Dezember 2026.">
  <title>Countdown | 31.12.2026</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body class="countdown-page">
  <header class="site-header">
    <a class="brand" href="./index.html">Countdown<span>2026</span></a>
    <nav aria-label="Hauptnavigation">
      <a href="./index.html" aria-current="page">Countdown</a>
      <a href="./abwesenheiten.html">Abwesenheiten</a>
    </nav>
    <button class="install-button" data-install hidden>Installieren</button>
  </header>
  <main class="countdown-main">
    <div class="eyebrow">Das Ziel im Blick</div>
    <h1>31. Dezember<br>2026</h1>
    <div class="calendar-count"><strong id="calendar-days">--</strong><span>Kalendertage<br>bis zum Ziel</span></div>
    <section class="work-count" aria-label="Verbleibende Arbeitszeit">
      <div><span class="metric-label">Arbeitstage nach heute</span><strong id="workdays">--</strong></div>
      <div><span class="metric-label">Restarbeitszeit heute</span><strong id="today-time" role="timer">--:--:--</strong></div>
    </section>
    <div class="countdown-details">
      <p>Arbeitszeit <strong>08:30 – 16:30</strong></p>
      <p id="next-absence">Abwesenheiten werden geladen …</p>
    </div>
    <p class="status" id="status" role="status"></p>
  </main>
  <footer class="countdown-footer"><span>Ein Tag weniger. Ein Schritt weiter.</span><span id="current-date"></span></footer>
</body>
</html>
